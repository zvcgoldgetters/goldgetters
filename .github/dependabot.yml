version: 2

updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'saturday'
      time: '08:00'
      timezone: 'Europe/Brussels'
    assignees:
      - 'robinpellegrims'
    commit-message:
      prefix: 'deps'
      prefix-development: 'deps-dev'
      include: 'scope'
    open-pull-requests-limit: 8
    cooldown:
      default-days: 5
      semver-major-days: 21
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - '*'
      payload-cms:
        patterns:
          - 'payload'
          - '@payloadcms/*'
      next-react:
        patterns:
          - 'next'
          - 'eslint-config-next'
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      radix-ui:
        patterns:
          - '@radix-ui/*'
          - 'radix-ui'
      styling:
        patterns:
          - '@tailwindcss/*'
          - 'tailwindcss'
          - 'tailwind-merge'
          - 'tw-animate-css'
          - 'class-variance-authority'
          - 'clsx'
      testing:
        dependency-type: 'development'
        patterns:
          - '@playwright/test'
          - '@testing-library/*'
          - '@vitejs/*'
          - 'jsdom'
          - 'monocart-reporter'
          - 'vitest'
      lint-format:
        dependency-type: 'development'
        patterns:
          - '@eslint/*'
          - '@pellegrims/eslint-config-base'
          - '@shadcn/lint'
          - '@typescript-eslint/*'
          - '@types/node'
          - 'eslint'
          - 'husky'
          - 'lint-staged'
          - 'prettier'
          - 'typescript'
      runtime-libraries:
        patterns:
          - '@types/nodemailer'
          - 'graphql'
          - 'lucide-react'
          - 'nodemailer'
          - 'sharp'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'saturday'
      time: '08:30'
      timezone: 'Europe/Brussels'
    assignees:
      - 'robinpellegrims'
    commit-message:
      prefix: 'ci'
      include: 'scope'
    open-pull-requests-limit: 3
    cooldown:
      default-days: 5
    groups:
      actions:
        patterns:
          - 'actions/*'
        update-types:
          - 'patch'
          - 'minor'
